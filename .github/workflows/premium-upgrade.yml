name: Premium complete upgrade
# The runner regenerates Level 1 certificates before packaging.

on:
  push:
    branches:
      - premium-complete-upgrade

permissions:
  contents: write

concurrency:
  group: premium-upgrade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          ref: premium-complete-upgrade
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Solve expanded Level 1 and write real certificates
        run: |
          ./gradlew :leveltool:run --args='solve --catalog content/catalog.json --output content/certificates --resume --beam 128 --max-expanded 100000 --timeout-ms 30000 --jobs 2' --console=plain --max-workers=2

      - name: Rebalance Level 1 star targets and replay certificates
        run: |
          ./gradlew :leveltool:run --args='rebalance --catalog content/catalog.json --certificates content/certificates --content-version 1.3.1 --orbit 1' --console=plain --max-workers=2

      - name: Strict catalog validation
        run: |
          ./gradlew :leveltool:run --args='validate --catalog content/catalog.json --strict' --console=plain --max-workers=2

      - name: Replay every level certificate
        run: |
          ./gradlew :leveltool:run --args='verify-certificates --catalog content/catalog.json' --console=plain --max-workers=2

      - name: Unit tests
        run: |
          ./gradlew :core:test :leveltool:test :app:testDebugUnitTest --console=plain --max-workers=2

      - name: Lint and build debug APK
        run: |
          ./gradlew :app:lintDebug :app:assembleDebug --console=plain --max-workers=2

      - name: Build unsigned release APK
        run: |
          ./gradlew :app:assembleRelease --console=plain --max-workers=2

      - name: Commit certified Level 1 content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/catalog.json content/levels/orbit-01/level-0001.json content/certificates/level-0001
          if ! git diff --cached --quiet; then
            git commit -m "Certify expanded opening level [skip ci]"
            git push origin HEAD:premium-complete-upgrade
          fi

      - name: Upload premium debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bubble-night-premium-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: bubble-night-premium-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
