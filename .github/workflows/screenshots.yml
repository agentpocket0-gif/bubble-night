name: Screenshots and video

# Boots the game in an emulator, drives it with taps and records what it actually draws.
# The screenshots and the clip are uploaded as artifacts so the visuals can be reviewed
# without a phone in hand.

on:
  workflow_dispatch:
  push:
    branches: [feature/premium-visual]

permissions:
  contents: read

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0" "build-tools;36.0.0"
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  shots:
    name: Run in emulator and capture
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the game and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            set -x
            mkdir -p shots
            adb wait-for-device
            adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done'
            SIZE=$(adb shell wm size | tr -d '\r' | awk '{print $3}')
            W=${SIZE%x*}
            H=${SIZE#*x}
            echo "screen $W x $H"
            adb install -r apk/app-debug.apk
            adb shell am start -n pt.tiago.bubblenight/.MainActivity
            sleep 8
            adb exec-out screencap -p > shots/01-home.png
            # primary button on the home screen (about 67% down)
            adb shell input tap $((W/2)) $((H*67/100))
            sleep 5
            adb exec-out screencap -p > shots/02-map.png
            # level node on the map (upper third, left column)
            adb shell input tap $((W*25/100)) $((H*45/100))
            sleep 5
            adb exec-out screencap -p > shots/03-node.png
            # bottom primary button on the map/preparation screen
            adb shell input tap $((W/2)) $((H*93/100))
            sleep 6
            adb exec-out screencap -p > shots/04-gameplay.png
            adb shell input tap $((W/2)) $((H*93/100))
            sleep 6
            adb exec-out screencap -p > shots/05-gameplay2.png
            # aim: swipe up the board to shoot
            adb shell input swipe $((W/2)) $((H*70/100)) $((W/2)) $((H*35/100)) 400
            sleep 4
            adb exec-out screencap -p > shots/06-after-shot.png
            adb shell screenrecord --time-limit 10 --bit-rate 2000000 /sdcard/game.mp4 &
            sleep 4
            adb shell input swipe $((W/2)) $((H*70/100)) $((W*70/100)) $((H*35/100)) 400
            sleep 4
            adb shell input swipe $((W/2)) $((H*70/100)) $((W*30/100)) $((H*35/100)) 400
            sleep 4
            adb pull /sdcard/game.mp4 shots/game.mp4 || true
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > shots/activity.txt || true
            adb logcat -d -t 300 > shots/logcat.txt || true
            ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-shots
          path: shots/
